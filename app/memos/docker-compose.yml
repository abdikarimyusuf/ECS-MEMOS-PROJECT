services:
  backend:
    build:
     context: .
     dockerfile: Dockerfile.backend
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # Optional: restart policy for local dev
    restart: unless-stopped

  frontend:
    build:
     context: ./web
     dockerfile: Dockerfile.frontend
    ports:
     - "3000:80"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # Optional: restart policy for local dev
    restart: unless-stopped


   
    