name: Terraform Plan

#on:
  pull_request:
    branches:
     - main

jobs:
  terraform plan:
    name: terraform format, validate & plan
    runs-on: ubuntu-latest


    steps:
    - name: checkout repository
      uses: action/checkout@v3

    - name: setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: AWS login
      uses: aws-actions/configure-aws-credentials@v2
      with: 
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Terraform Init
      working-directory: terraform
      run: terraform init -input=false

    - name: Terraform Format
      working-directory: terraform
      run: terraform fmt -check

    - name: Terraform Validate
      working-directory: terraform
      run: terraform validate

    - name: install Snyk
      run: npm install -g snyk

    - name: snky iaC scan
      working-directory: terraform
      run: snyk iac test --severity-threshold=high
      env: 
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Terraform Plan
      id: tfplan
      working-directory: terraform
      run: terraform plan -no-color -out=tfplan.binary

    - name: Convert Plan to Text
      working-directory: terraform
      run: terraform show -no-color tfplan.binary > tfplan.txt

    - name: Post Plan as PR comment
      uses: arocchino/sticky-pull-request-comment@v2
      with:
         recreate: true
         path: terraform/tfplan.txt



        

      


      


    
